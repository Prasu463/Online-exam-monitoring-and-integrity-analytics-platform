<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Registration - ExamGuard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#0d6efd,#6610f2);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:30px;
        }

        .register-card{
            width:800px;
            background:rgba(255,255,255,.15);
            backdrop-filter:blur(15px);
            border-radius:20px;
            padding:40px;
            color:white;
            box-shadow:0 8px 30px rgba(0,0,0,.3);
        }

        h2{
            text-align:center;
            margin-bottom:10px;
            font-weight:bold;
        }

        p{
            text-align:center;
            margin-bottom:30px;
        }

        .form-control{
            border-radius:10px;
            padding:12px;
        }

        .btn-register{
            width:100%;
            padding:12px;
            border:none;
            border-radius:10px;
            background:#28a745;
            color:white;
            font-size:18px;
            font-weight:bold;
        }

        .btn-register:hover{
            background:#218838;
        }

        a{
            color:white;
            text-decoration:none;
        }

        a:hover{
            text-decoration:underline;
        }

        .alert{
            border-radius:10px;
        }
    </style>

</head>

<body>

<div class="register-card">

    <h2>📝 Candidate Registration</h2>

    <p>Create your ExamGuard account</p>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="/register" method="POST">

        <div class="row">

            <div class="col-md-6 mb-3">
                <label>Full Name</label>
                <input
                    type="text"
                    name="fullname"
                    class="form-control"
                    placeholder="Enter Full Name"
                    required>
            </div>

            <div class="col-md-6 mb-3">
                <label>Email</label>
                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter Email"
                    required>
            </div>

            <div class="col-md-6 mb-3">
                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter Password"
                    required>
            </div>

            <div class="col-md-6 mb-3">
                <label>Phone Number</label>
                <input
                    type="text"
                    name="phone"
                    class="form-control"
                    placeholder="Enter Phone Number"
                    required>
            </div>

        </div>

        <button class="btn-register mt-3">
            Register
        </button>

    </form>

    <div class="text-center mt-4">

        Already have an account?

        <a href="/login">
            Login Here
        </a>

    </div>

</div>

</body>
</html>

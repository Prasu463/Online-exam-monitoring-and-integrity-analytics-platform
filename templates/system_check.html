<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Compatibility Check | ExamGuard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:linear-gradient(135deg,#0d6efd,#6610f2);
            font-family:Arial, Helvetica, sans-serif;
        }

        .card-box{
            width:850px;
            margin:50px auto;
            background:white;
            border-radius:20px;
            padding:35px;
            box-shadow:0px 10px 30px rgba(0,0,0,.25);
        }

        h2{
            color:#0d6efd;
            text-align:center;
            margin-bottom:30px;
        }

        .status-row{
            display:flex;
            justify-content:space-between;
            align-items:center;
            background:#f8f9fa;
            padding:15px;
            border-radius:10px;
            margin-bottom:15px;
            font-size:18px;
        }

        .good{
            color:green;
            font-weight:bold;
        }

        .bad{
            color:red;
            font-weight:bold;
        }

        .btn-next{
            width:100%;
            margin-top:25px;
            padding:14px;
            font-size:20px;
        }

    </style>

</head>

<body>

<div class="card-box">

    <h2>🖥 System Compatibility Check</h2>

    <div class="status-row">
        <span>📷 Webcam</span>
        <span id="camera">Checking...</span>
    </div>

    <div class="status-row">
        <span>🎤 Microphone</span>
        <span id="microphone">Checking...</span>
    </div>

    <div class="status-row">
        <span>🌐 Internet</span>
        <span id="internet">Checking...</span>
    </div>

    <div class="status-row">
        <span>🖥 Screen Resolution</span>
        <span id="resolution"></span>
    </div>

    <div class="status-row">
        <span>🌍 Browser</span>
        <span id="browser"></span>
    </div>

    <div class="status-row">
        <span>🪟 Full Screen</span>
        <span id="fullscreen">Disabled</span>
    </div>

    <div class="status-row">
        <span>📅 Date & Time</span>
        <span id="datetime"></span>
    </div>

    <button class="btn btn-success btn-next" onclick="continueExam()">
        Continue →
    </button>

</div>

<script>

// Screen Resolution

document.getElementById("resolution").innerHTML =
screen.width + " × " + screen.height;


// Browser

let browser = "Unknown";

if(navigator.userAgent.indexOf("Chrome") != -1)
{
    browser = "Google Chrome";
}
else if(navigator.userAgent.indexOf("Firefox") != -1)
{
    browser = "Mozilla Firefox";
}
else if(navigator.userAgent.indexOf("Edge") != -1)
{
    browser = "Microsoft Edge";
}

document.getElementById("browser").innerHTML = browser;


// Internet

if(navigator.onLine)
{
    document.getElementById("internet").innerHTML =
    "<span class='good'>✅ Connected</span>";
}
else
{
    document.getElementById("internet").innerHTML =
    "<span class='bad'>❌ Offline</span>";
}


// Camera + Microphone

navigator.mediaDevices.getUserMedia({
    video:true,
    audio:true
})
.then(function(stream){

    document.getElementById("camera").innerHTML =
    "<span class='good'>✅ Working</span>";

    document.getElementById("microphone").innerHTML =
    "<span class='good'>✅ Working</span>";

    stream.getTracks().forEach(track=>track.stop());

})
.catch(function(){

    document.getElementById("camera").innerHTML =
    "<span class='bad'>❌ Not Available</span>";

    document.getElementById("microphone").innerHTML =
    "<span class='bad'>❌ Not Available</span>";

});


// Date & Time

setInterval(function(){

    let today = new Date();

    document.getElementById("datetime").innerHTML =
    today.toLocaleString();

},1000);


// Full Screen

function enableFullScreen(){

    if(document.documentElement.requestFullscreen){

        document.documentElement.requestFullscreen();

    }

}

enableFullScreen();

document.addEventListener("fullscreenchange",function(){

    if(document.fullscreenElement){

        document.getElementById("fullscreen").innerHTML =
        "<span class='good'>✅ Enabled</span>";

    }else{

        document.getElementById("fullscreen").innerHTML =
        "<span class='bad'>❌ Disabled</span>";

    }

});


// Continue

function continueExam(){

    window.location.href="/government_id";

}

</script>

</body>
</html>

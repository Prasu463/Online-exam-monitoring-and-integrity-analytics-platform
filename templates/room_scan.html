<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Room Scan | ExamGuard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background: linear-gradient(135deg,#0d6efd,#6610f2);
            font-family: Arial, Helvetica, sans-serif;
        }

        .container-box{
            max-width:1000px;
            margin:30px auto;
            background:white;
            border-radius:20px;
            padding:30px;
            box-shadow:0 10px 25px rgba(0,0,0,.3);
        }

        h2{
            text-align:center;
            color:#0d6efd;
            font-weight:bold;
        }

        p{
            text-align:center;
            color:#666;
            margin-bottom:30px;
        }

        video{
            width:100%;
            border:4px solid #0d6efd;
            border-radius:15px;
            margin-bottom:20px;
        }

        canvas{
            display:none;
        }

        .preview{
            width:100%;
            height:170px;
            object-fit:cover;
            border:2px solid #ddd;
            border-radius:10px;
            background:#f8f9fa;
        }

        .capture-btn{
            width:100%;
            margin-top:10px;
        }

        .submit-btn{
            width:100%;
            margin-top:30px;
            font-size:20px;
        }

    </style>

</head>

<body>

<div class="container">

<div class="container-box">

<h2>🏠 Room Scan</h2>

<p>
Please capture all four directions of your room before continuing.
</p>

<video id="video" autoplay playsinline></video>

<canvas id="canvas"></canvas>

<div class="row">

<div class="col-md-3">

<h5 class="text-center">Front</h5>

<img id="frontPreview" class="preview">

<button
type="button"
class="btn btn-primary capture-btn"
onclick="captureImage('front')">

Capture Front

</button>

</div>

<div class="col-md-3">

<h5 class="text-center">Left</h5>

<img id="leftPreview" class="preview">

<button
type="button"
class="btn btn-warning capture-btn"
onclick="captureImage('left')">

Capture Left

</button>

</div>

<div class="col-md-3">

<h5 class="text-center">Right</h5>

<img id="rightPreview" class="preview">

<button
type="button"
class="btn btn-info capture-btn"
onclick="captureImage('right')">

Capture Right

</button>

</div>

<div class="col-md-3">

<h5 class="text-center">Back</h5>

<img id="backPreview" class="preview">

<button
type="button"
class="btn btn-danger capture-btn"
onclick="captureImage('back')">

Capture Back

</button>

</div>

</div>

<form method="POST">

<input
type="hidden"
name="front"
id="front">

<input
type="hidden"
name="left"
id="left">

<input
type="hidden"
name="right"
id="right">

<input
type="hidden"
name="back"
id="back">

<button
type="submit"
class="btn btn-success submit-btn"
onclick="return validateRoomScan()">

Continue →

</button>

</form>

</div>

</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

// Start Webcam

navigator.mediaDevices.getUserMedia({
    video:true
})
.then(function(stream){

    video.srcObject = stream;

})
.catch(function(error){

    alert("Camera access denied.");

});


// Capture Image

function captureImage(position){

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(video,0,0);

    const image = canvas.toDataURL("image/png");

    document.getElementById(position).value = image;

    document.getElementById(position + "Preview").src = image;

    alert(position.toUpperCase() + " image captured successfully.");

}


// Validation

function validateRoomScan(){

    if(document.getElementById("front").value==""){

        alert("Please capture Front view.");

        return false;

    }

    if(document.getElementById("left").value==""){

        alert("Please capture Left view.");

        return false;

    }

    if(document.getElementById("right").value==""){

        alert("Please capture Right view.");

        return false;

    }

    if(document.getElementById("back").value==""){

        alert("Please capture Back view.");

        return false;

    }

    return true;

}

</script>

</body>

</html>

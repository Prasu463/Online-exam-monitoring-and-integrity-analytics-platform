<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>All Candidates | ExamGuard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f7fb;
    font-family:Arial, Helvetica, sans-serif;
}

.container{
    margin-top:40px;
}

.card{
    border:none;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

table{
    margin-top:20px;
}

img{
    width:60px;
    height:60px;
    border-radius:50%;
    border:2px solid #0d6efd;
}

h2{
    color:#0d6efd;
    font-weight:bold;
}

.btn-back{
    margin-top:20px;
}

</style>

</head>

<body>

<div class="container">

<div class="card p-4">

<h2 class="text-center">
👥 Registered Candidates
</h2>

<table class="table table-striped table-bordered table-hover text-center align-middle">

<thead class="table-primary">

<tr>

<th>ID</th>

<th>Photo</th>

<th>Full Name</th>

<th>Email</th>

<th>Phone</th>

</tr>

</thead>

<tbody>

{% for candidate in candidates %}

<tr>

<td>{{ candidate[0] }}</td>

<td>

<img src="{{ url_for('static', filename='uploads/' + candidate[4]) }}">

</td>

<td>{{ candidate[1] }}</td>

<td>{{ candidate[2] }}</td>

<td>{{ candidate[3] }}</td>

</tr>

{% endfor %}

</tbody>

</table>

<div class="text-center">

<a href="/dashboard" class="btn btn-primary btn-back">
⬅ Back to Dashboard
</a>

</div>

</div>

</div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Login - ExamGuard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#0d6efd,#6610f2);
        }

        .login-card{
            width:420px;
            padding:40px;
            border-radius:20px;
            background:rgba(255,255,255,0.15);
            backdrop-filter:blur(15px);
            box-shadow:0 8px 32px rgba(0,0,0,0.3);
            color:white;
        }

        .login-card h2{
            text-align:center;
            margin-bottom:10px;
            font-weight:bold;
        }

        .login-card p{
            text-align:center;
            margin-bottom:25px;
            color:#f8f9fa;
        }

        .form-control{
            border-radius:10px;
            padding:12px;
        }

        .btn-login{
            width:100%;
            padding:12px;
            border-radius:10px;
            font-size:18px;
            background:#ffc107;
            border:none;
            color:black;
            font-weight:bold;
        }

        .btn-login:hover{
            background:#ffca2c;
        }

        a{
            color:white;
            text-decoration:none;
        }

        a:hover{
            text-decoration:underline;
        }

        .footer-text{
            text-align:center;
            margin-top:20px;
        }

        .alert{
            border-radius:10px;
        }

    </style>

</head>

<body>

<div class="login-card">

    <h2>👤 Candidate Login</h2>

    <p>Welcome to ExamGuard</p>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="/login" method="POST">

        <div class="mb-3">
            <label>Email</label>
            <input
                type="email"
                name="email"
                class="form-control"
                placeholder="Enter your email"
                required>
        </div>

        <div class="mb-3">

            <label>Password</label>

            <div class="input-group">

                <input
                    type="password"
                    name="password"
                    id="password"
                    class="form-control"
                    placeholder="Enter Password"
                    required>

                <button
                    class="btn btn-light"
                    type="button"
                    onclick="togglePassword()">
                    👁
                </button>

            </div>

        </div>

        <div class="form-check mb-3">

            <input
                class="form-check-input"
                type="checkbox"
                id="remember">

            <label
                class="form-check-label"
                for="remember">
                Remember Me
            </label>

        </div>

        <button class="btn-login">
            Login
        </button>

    </form>

    <div class="footer-text">

        Don't have an account?

        <a href="/register">
            Register Here
        </a>

    </div>

</div>

<script>

function togglePassword(){

    var password = document.getElementById("password");

    if(password.type === "password"){
        password.type = "text";
    }
    else{
        password.type = "password";
    }

}

</script>

</body>
</html>

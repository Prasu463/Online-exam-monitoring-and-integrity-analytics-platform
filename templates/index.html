<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ExamGuard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            background:linear-gradient(135deg,#0d6efd,#6610f2);
            height:100vh;
            overflow:hidden;
            color:white;

        }

        .navbar{

            background:transparent;
            padding:20px;

        }

        .navbar-brand{

            color:white !important;
            font-size:32px;
            font-weight:bold;

        }

        .hero{

            height:85vh;
            display:flex;
            justify-content:center;
            align-items:center;
            text-align:center;

        }

        .hero h1{

            font-size:65px;
            font-weight:bold;
            margin-bottom:15px;

        }

        .hero h3{

            font-size:28px;
            margin-bottom:20px;

        }

        .hero p{

            font-size:20px;
            margin-bottom:40px;

        }

        .btn-custom{

            width:220px;
            padding:15px;
            margin:10px;
            border-radius:50px;
            font-size:20px;
            font-weight:bold;
            transition:.3s;

        }

        .btn-custom:hover{

            transform:scale(1.05);

        }

        footer{

            position:absolute;
            bottom:15px;
            width:100%;
            text-align:center;
            font-size:16px;

        }

    </style>

</head>

<body>

<nav class="navbar">

<div class="container">

<a class="navbar-brand" href="/">

🛡️ ExamGuard

</a>

</div>

</nav>

<div class="hero">

<div>

<h1>ExamGuard</h1>

<h3>Online Exam Monitoring & Integrity Analytics Platform</h3>

<p>

Secure • Smart • AI Powered Examination System

</p>

<a href="/register" class="btn btn-success btn-custom">

Register

</a>

<br>

<a href="/login" class="btn btn-warning btn-custom">

Candidate Login

</a>

</div>

</div>

<footer>

© 2026 ExamGuard | Online Examination Platform

</footer>

</body>

</html>

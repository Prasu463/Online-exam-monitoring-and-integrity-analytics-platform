<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ExamGuard Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f7fb;
}

.navbar{
    background:#0d6efd;
}

.sidebar{
    background:#0b5ed7;
    color:white;
    min-height:100vh;
    padding:25px;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    transition:.3s;
}

.sidebar a:hover{
    background:white;
    color:#0d6efd;
}

.profile-card{
    background:white;
    border-radius:15px;
    padding:30px;
    box-shadow:0 0 15px rgba(0,0,0,.1);
}

.profile-card img{
    width:160px;
    height:160px;
    border-radius:50%;
    border:5px solid #0d6efd;
}

.info{
    margin-top:20px;
}

.info p{
    font-size:18px;
}

.card-box{
    border:none;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,.1);
    transition:.3s;
}

.card-box:hover{
    transform:translateY(-8px);
}

</style>

</head>

<body>

<nav class="navbar navbar-dark">

<div class="container-fluid">

<span class="navbar-brand fw-bold">
ExamGuard Dashboard
</span>

</div>

</nav>

<div class="container-fluid">

<div class="row">

<div class="col-md-3 sidebar">

<h3>ExamGuard</h3>

<hr>

<a href="/dashboard">🏠 Dashboard</a>
<a href="/start_exam">📝 Start Exam</a>
<a href="/candidates">👥 Candidates</a>
<a href="/logout">🚪 Logout</a>

</div>

<div class="col-md-9 p-4">

<div class="profile-card text-center">

<!-- Candidate Photo -->
<img src="{{ url_for('static', filename='uploads/' + user[3]) }}" alt="Candidate">

<h2 class="mt-3">{{ user[0] }}</h2>

<p class="text-success fw-bold">Candidate</p>

<div class="row mt-4">

<div class="col-md-6 info">

<p><b>Email :</b> {{ user[1] }}</p>

<p><b>Phone :</b> {{ user[2] }}</p>

</div>

<div class="col-md-6 info">

<p><b>Status :</b> Active ✅</p>

<p><b>Exam Platform :</b> ExamGuard</p>

</div>

</div>

</div>

<div class="row mt-4">

<div class="col-md-4">

<div class="card card-box p-4 text-center">

<h1>📝</h1>

<h4>Start Exam</h4>

<a href="/start_exam" class="btn btn-primary mt-2">
Start Now
</a>

</div>

</div>

<div class="col-md-4">

<div class="card card-box p-4 text-center">

<h1>👥</h1>

<h4>View Candidates</h4>

<a href="/candidates" class="btn btn-success mt-2">
Open
</a>

</div>

</div>

<div class="col-md-4">

<div class="card card-box p-4 text-center">

<h1>🚪</h1>

<h4>Logout</h4>

<a href="/logout" class="btn btn-danger mt-2">
Logout
</a>

</div>

</div>

</div>

</div>

</div>

</div>

</body>
</html>
